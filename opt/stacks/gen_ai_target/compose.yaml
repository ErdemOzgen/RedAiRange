version: "3.8"
services:
  gen_ai_ai_target:
    stdin_open: true
    tty: true
    #user: root # Run container as root
    ports:
      - 11008:8888
    volumes:
      - .:/home/jovyan/work
    image: erdemozgen/rar-target-one
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys, urllib.request as u; r=u.urlopen('http://localhost:8888/api', timeout=5); sys.exit(0 if r.status < 400 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
networks: {}
